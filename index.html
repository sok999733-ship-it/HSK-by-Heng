            { c: "你什么时候有空？", p: "Nǐ shénme shíhòu yǒu kòng?", k: "តើអ្នកទំនេរនៅពេលណា?", level: "HSK2" },

            { c: "我同意你的看法。", p: "Wǒ tóngyì nǐ de kànfǎ.", k: "ខ្ញុំយល់ស្របជាមួយទស្សនៈរបស់អ្នកទាំងស្រុង។", level: "HSK3" },

            { c: "颜色非常搭配。", p: "Yánsè fēicháng dāpèi.", k: "ពណ៌ស្រុះគ្នាសម្រេចបានល្អណាស់។", level: "HSK4" },
            { c: "我打算买一台新手机。", p: "Wǒ dǎsuan mǎi yì tái xīn shǒujī.", k: "ខ្ញុំមានគម្រោងទិញទូរស័ព្ទដៃថ្មីមួយគ្រឿង។", level: "HSK3" },

            { c: "路上慢走。", p: "Lùshang màn zǒu.", k: "ធ្វើដំណើរតាមផ្លូវប្រយ័ត្នប្រយែង។", level: "HSK2" },
            { c: "非常感谢您的照顾。", p: "Fēicháng gǎnxiè nín de zhàogu.", k: "អរគុណខ្លាំងណាស់សម្រាប់ការថែទាំកន្លងមក។", level: "HSK3" },
            { c: "祝您身体健康，生意兴隆！", p: "Zhù nín shēntǐ jiànkāng, shēngyì xīnglóng!", k: "សូមជូនពរលោកសុខភាពល្អ និងរកស៊ីមានបានកាន់តែរីកចម្រើន!", level: "HSK4" }
        ];

        // Pagination State
        let currentPage = 1;
        const itemsPerPage = 30;
        let filteredData = [...vocabulary];

        // Filter Function
        function filterData() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const selectedLevel = document.getElementById('levelFilter').value;

            filteredData = vocabulary.filter(item => {
                const matchesLevel = (selectedLevel === "ALL") || (item.level === selectedLevel);
                const matchesQuery = item.c.toLowerCase().includes(query) || 
                                     item.p.toLowerCase().includes(query) || 
                                     item.k.toLowerCase().includes(query);
                return matchesLevel && matchesQuery;
            });
        }

        function onFilterChange() {
            filterData();
            currentPage = 1;
            render();
        }

        function changePage(direction) {
            const maxPage = Math.ceil(filteredData.length / itemsPerPage) || 1;
            currentPage += direction;
            if (currentPage < 1) currentPage = 1;
            if (currentPage > maxPage) currentPage = maxPage;
            render();
        }

        function render() {
            const lessonsList = document.getElementById('lessonsList');
            const totalResults = document.getElementById('totalResults');
            const pageIndicator = document.getElementById('pageIndicator');
            const paginationText = document.getElementById('paginationText');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            const total = filteredData.length;
            const maxPage = Math.ceil(total / itemsPerPage) || 1;

            totalResults.textContent = `រកឃើញ ${total} ពាក្យ`;
            pageIndicator.textContent = `ទំព័រ ${currentPage} / ${maxPage}`;
            paginationText.textContent = `${currentPage}`;

            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === maxPage || maxPage === 0;

            if (total === 0) {
                lessonsList.innerHTML = `<div class="no-result">មិនមានពាក្យដែលអ្នកស្វែងរកឡើយ</div>`;
                return;
            }

            const startIndex = (currentPage - 1) * itemsPerPage;
            const pageItems = filteredData.slice(startIndex, startIndex + itemsPerPage);

            lessonsList.innerHTML = pageItems.map(item => `
                <div class="lesson-card ${item.level.toLowerCase()}">
                    <div class="lesson-info">
                        <div class="chinese-wrapper">
                            <span class="chinese">${item.c}</span>
                            <span class="tag tag-${item.level.toLowerCase()}">${item.level}</span>
                        </div>
                        <span class="pinyin">${item.p}</span>
                        <span class="khmer">${item.k}</span>
                    </div>
                    <button class="audio-btn" onclick="speakChinese('${item.c}')">
                        🔊 ស្តាប់
                    </button>
                </div>
            `).join('');
        }

        // Text-to-Speech Function
        function speakChinese(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Stop previous audio
                let utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-CN';
                utterance.rate = 0.9; // Slightly slower for better learning
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Browser របស់អ្នកមិនទ្រទ្រង់មុខងារបញ្ចេញសំឡេងនេះទេ។");
            }
        }

        // Initial render
        render();
    </script>
